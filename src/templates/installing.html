<!DOCTYPE html>
<html data-theme="light">
<head>
    <meta charset="utf-8">
    <title>Installing {{ platform.product_name }}…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include '_theme.html' %}
</head>
<body>
    {% with floating=True %}{% include '_theme_toggle.html' %}{% endwith %}

    <div class="page-narrow" id="install-page">
        <div class="brand">Home<span>{{ platform.product_suffix }}</span></div>
        <h2 id="status-title">Installation in progress</h2>
        <p id="status-sub" class="tagline">Please do not unplug. This takes about 15 minutes.</p>

        <p id="phase" class="install-phase mt">Starting…</p>
        <p id="pulse" class="hint muted"></p>

        <details class="mt">
            <summary class="small muted">Show technical details</summary>
            <pre id="logs" class="install-log mt">Connecting to log stream…</pre>
        </details>
    </div>

    <script src="{{ url_for('static', filename='creds_sheet.js') }}?v={{ asset_v }}"></script>
    <script>
        const BRAND_SUFFIX = {{ platform.product_suffix | tojson }};
        const handoverReady = {{ handover_ready|default('false')|lower }};
        const restoreMode = {{ restore_mode|default('false')|lower }};
        // A restore install streams deploy.sh AND restore.sh into one log, so
        // deploy's own marker lands while the data is still being written.
        // Waiting for the right one is what keeps the owner from being handed
        // credentials to a half-restored box.
        const DONE_MARKER = restoreMode
            ? 'Restore Complete - Ready for Handover'
            : 'Deployment Complete - Ready for Handover';

        if (restoreMode) {
            document.getElementById('status-title').textContent = 'Restoring your HomeBrain';
            document.getElementById('status-sub').textContent =
                'Please do not unplug. Installing, then downloading and unpacking your backup. '
                + 'This takes longer than a fresh install — how much longer depends on the size '
                + 'of the backup and your connection.';
        }

        // The log is an operator's log — health-check warnings, container
        // names, occ commands. Shown raw it made a normal install look like a
        // failing one (a non-fatal "vaultwarden failed health check" during
        // startup was read as a broken box). So the owner gets a phase, and
        // the log is one click away for whoever actually wants it.
        //
        // Markers are matched in order and the LAST one present wins, which is
        // exactly how the two scripts run: deploy.sh start to finish, then
        // restore.sh start to finish.
        const PHASES = [
            ['=== Starting Deployment',            'Preparing the system'],
            ['Deploying Docker stack',             'Downloading and starting services'],
            ['Waiting for Nextcloud installation', 'Setting up Nextcloud'],
            ['Configuring trusted proxies',        'Applying network settings'],
            ['Configuring Cron',                   'Finishing the install'],
            ['Deployment Complete - Ready',        restoreMode ? 'Starting the restore' : 'Almost done'],
            // restore.sh — only reachable on a restore install
            ['from the off-site remote',           'Downloading your backup'],
            ['Decrypting and unpacking',           'Unpacking your backup — the long step. It prints nothing until it is done.'],
            ['Analyzing backup structure',         'Reading your backup'],
            ['Restoring Nextcloud Data',           'Restoring your files'],
            ['Restoring Home Assistant Config',    'Restoring Home Assistant'],
            ['Restoring OpenClaw',                 'Restoring your agent'],
            ['Restoring Nextcloud Config',         'Restoring Nextcloud settings'],
            ['Restoring Nextcloud Database',       'Restoring the Nextcloud database'],
            ['Restoring Vault',                    'Restoring your vault'],
            ['Restarting Docker Stack',            'Restarting services'],
            ['Updating restored config with',      'Applying network settings'],
            ['Running post-restore',               'Final checks'],
        ];

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }

        function phaseFor(log) {
            let label = null;
            for (const [marker, text] of PHASES) {
                if (log.includes(marker)) label = text;
            }
            return label;
        }

        let finished = false;
        let sawRunning = false;
        let lastLog = '';
        let lastChange = Date.now();
        const logsEl = document.getElementById('logs');
        const phaseEl = document.getElementById('phase');
        const pulseEl = document.getElementById('pulse');

        // "Is it stuck?" is the question this screen has to answer, and the
        // honest answer is how long ago the install last said anything.
        setInterval(() => {
            if (finished) return;
            const secs = Math.round((Date.now() - lastChange) / 1000);
            pulseEl.textContent = secs < 90
                ? `Working… last update ${secs}s ago.`
                : `Working… last update ${Math.round(secs / 60)} min ago. Long steps are normal here.`;
        }, 1000);

        const poller = setInterval(() => {
            if (finished) return;
            fetch('/api/logs/setup').then(r => {
                if (r.status === 401) { location.reload(); return null; }
                return r.text();
            }).then(t => {
                if (!t) return;
                if (t !== lastLog) { lastLog = t; lastChange = Date.now(); }
                logsEl.textContent = t;
                logsEl.scrollTop = logsEl.scrollHeight;
                const label = phaseFor(t);
                if (label) phaseEl.textContent = label;
                if (t.includes(DONE_MARKER)) {
                    finished = true;
                    clearInterval(poller);
                    setTimeout(fetchCredentials, 1000);
                }
            }).catch(() => { logsEl.textContent += '\n[Reconnecting…]'; });
        }, 3000);

        // A failed install used to leave this screen polling a log that would
        // never gain its marker, forever. The task status says the work has
        // stopped; the credentials endpoint says what state it stopped in.
        setInterval(() => {
            if (finished) return;
            fetch('/api/task_status').then(r => (r.ok ? r.json() : null)).then(s => {
                if (!s) return;
                if (s.status === 'running') { sawRunning = true; return; }
                if (!sawRunning) return;
                finished = true;
                clearInterval(poller);
                fetchCredentials();
            }).catch(() => {});
        }, 4000);

        // The credentials file is written moments after the log line lands.
        function fetchCredentials(retries = 5) {
            fetch('/api/setup/credentials', { cache: 'no-store' })
                .then(res => {
                    if (!res.ok && retries > 0) {
                        setTimeout(() => fetchCredentials(retries - 1), 2000);
                        return null;
                    }
                    if (!res.ok) throw new Error('Credentials not found');
                    return res.json();
                })
                .then(data => { if (data) showSuccess(data); })
                .catch(e => {
                    console.error(e);
                    // No credentials means the install did not get far enough to
                    // write any — this is a failed install, not a finished one,
                    // and saying "the system is ready" sent owners to a login
                    // screen that could not accept anything they had.
                    document.getElementById('install-page').innerHTML = `
                        <div class="brand">Home<span>${BRAND_SUFFIX}</span></div>
                        <h2>Installation did not complete</h2>
                        <p class="muted">No credentials were produced, so there is nothing to log in with yet.</p>
                        <details class="mt">
                            <summary class="small muted">Show technical details</summary>
                            <pre class="install-log mt">${escapeHtml(lastLog) || 'No log was captured.'}</pre>
                        </details>
                        <button class="btn-main" onclick="location.reload()">Try again</button>`;
                });
        }

        // Whether THIS install was a restore comes from the credentials file,
        // not from restoreMode: the in-flight marker is cleared before this
        // screen renders, and a page opened fresh on the handover would
        // otherwise call a restore a plain setup.
        function headline(data) {
            if (data.restore_failed) return 'Restore did not finish';
            if (data.restored) return 'Restore complete';
            return 'Setup complete';
        }

        function blurb(data) {
            if (data.restore_failed) {
                return 'HomeBrain is installed, but your backup could not be restored — open the '
                     + 'technical details below for the reason. Save these credentials first: they '
                     + 'are shown only once, and you need them to log in and try the restore again '
                     + 'from Settings → Backups.';
            }
            if (data.restored) {
                return data.recovery_adopted
                    ? 'Your files, Home Assistant setup and vault are back. You unlocked this backup with your recovery phrase, so this box has a new master password — save it now. Your recovery phrase is unchanged.'
                    : 'Your files, Home Assistant setup and vault are back. Your master password is unchanged — it is the one you just entered.';
            }
            return 'Your private cloud is ready. Save these credentials now.';
        }

        function showSuccess(data) {
            handoverCreds = { password: data.password, phrase: data.recovery_phrase };
            const page = document.getElementById('install-page');
            page.innerHTML = `
                <div class="brand">Home<span>${BRAND_SUFFIX}</span></div>

                <div class="success-box mt">
                    <h2>${headline(data)}</h2>
                    <p>${blurb(data)}</p>

                    <div class="creds-block">
                        <span class="creds-label">Master username</span>
                        <span class="creds-value">admin</span>
                    </div>
                    <div class="creds-block">
                        <span class="creds-label">Master password</span>
                        <div class="creds-secret">${data.password}</div>
                    </div>

                    ${data.recovery_phrase ? `
                    <div class="creds-block">
                        <span class="creds-label">Recovery phrase</span>
                        <div class="creds-secret">${data.recovery_phrase}</div>
                        <p class="hint">Write these words down and keep them safe. They are your only way back in
                            if you forget the master password, and they are shown only once. They reset
                            administrative access and open your encrypted backups; they do not unlock individual vault items.</p>
                    </div>` : ''}

                    <button type="button" onclick="downloadHandoverSheet()">Download as .txt</button>
                    <p id="sheet-err" class="hint" style="color:var(--danger);"></p>

                    <p class="small muted">This password grants full administrative access to your Dashboard,
                        Nextcloud, and Home Assistant.</p>

                    ${data.restore_failed ? `
                    <details class="mt">
                        <summary class="small muted">Show technical details</summary>
                        <pre class="install-log mt">${escapeHtml(lastLog) || 'No log was captured.'}</pre>
                    </details>` : ''}

                    ${data.cloud_enabled ? `
                    <div class="activate-card">
                        <h3>Activate remote access</h3>
                        <p class="small">Register your device to enable remote access and finish setup.</p>
                        <div class="activate-row">
                            <input type="email" id="cloud-email" placeholder="Enter your email address" required>
                            <button onclick="registerCloud()" id="btn-cloud">Activate</button>
                        </div>
                        <p id="cloud-msg" class="activate-msg"></p>
                        <div id="confirmation-gate" class="confirm-gate">
                            <label class="check">
                                <input type="checkbox" id="chk-confirm" onchange="toggleLoginBtn()">
                                <span>I have received the email and set my password.</span>
                            </label>
                        </div>
                    </div>` : ''}

                    <div id="login-section" ${data.cloud_enabled ? 'style="display:none;"' : ''}>
                        <button class="btn-main stretch" id="btn-login-final" onclick="confirmAndLogin()"
                                ${data.cloud_enabled ? 'disabled' : ''}>
                            I have saved my password — log in
                        </button>
                    </div>
                </div>`;
        }

        function registerCloud() {
            const email = document.getElementById('cloud-email').value;
            const btn = document.getElementById('btn-cloud');
            const msg = document.getElementById('cloud-msg');

            if (!email.includes('@')) {
                msg.textContent = 'Please enter a valid email address.';
                msg.style.color = 'var(--danger)';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending…';
            document.getElementById('cloud-email').disabled = true;
            msg.textContent = '';

            fetch('/api/cloud/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        msg.textContent = data.message;
                        msg.style.color = 'var(--accent)';
                        btn.textContent = 'Activated';
                        document.getElementById('login-section').style.display = 'block';
                        document.getElementById('confirmation-gate').style.display = 'block';
                    } else {
                        msg.textContent = data.error || 'Failed to send.';
                        msg.style.color = 'var(--danger)';
                        btn.disabled = false;
                        btn.textContent = 'Send invite';
                    }
                })
                .catch(() => {
                    msg.textContent = 'Connection error.';
                    msg.style.color = 'var(--danger)';
                    btn.disabled = false;
                    document.getElementById('cloud-email').disabled = false;
                    btn.textContent = 'Send invite';
                });
        }

        // Populated by showSuccess(). The sheet builder itself is shared with
        // the dashboard and lives in static/creds_sheet.js.
        let handoverCreds = null;

        function downloadHandoverSheet() {
            if (!handoverCreds) return;
            // The builder is a separate request now. If it did not arrive, this
            // click would do nothing at all, and the owner's next click is "I
            // have saved my password" -> cleanup_credentials -> the only copy of
            // this password and phrase is deleted. Say so instead.
            if (typeof downloadCredsSheet !== 'function') {
                document.getElementById('sheet-err').textContent =
                    'Download unavailable — copy the password and phrase above before continuing.';
                return;
            }
            downloadCredsSheet(handoverCreds);
        }

        function toggleLoginBtn() {
            document.getElementById('btn-login-final').disabled = !document.getElementById('chk-confirm').checked;
        }

        function confirmAndLogin() {
            fetch('/api/setup/cleanup_credentials', { method: 'POST' })
                .finally(() => { window.location.href = '/'; });
        }

        if (handoverReady) {
            finished = true;
            logsEl.textContent = 'Resuming session… retrieving credentials…';
            // Pick the log up first: on a failed restore the handover screen
            // offers it as the explanation, and this path never ran the poller.
            fetch('/api/logs/setup')
                .then(r => (r.ok ? r.text() : ''))
                .then(t => { lastLog = t || ''; })
                .catch(() => {})
                .then(() => fetchCredentials());
        }
    </script>
</body>
</html>

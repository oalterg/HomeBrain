services:
  db:
    image: mariadb:11.4.13
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:8.6.8-alpine
    restart: unless-stopped
    # Loopback-only publish: the manager (gunicorn on the host) uses Redis as
    # shared rate-limit storage — its 3 workers otherwise each count limits
    # separately in memory.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  nextcloud:
    image: nextcloud:33.0.11-apache
    restart: unless-stopped
    # Loopback only — Caddy is the LAN face. Health/MCP/self-test use 127.0.0.1.
    ports:
      - "127.0.0.1:${NEXTCLOUD_PORT:-8080}:80"
    volumes:
      - nextcloud_html:/var/www/html
      - ${NEXTCLOUD_DATA_DIR:-/home/homebrain/nextcloud-data}:/var/www/html/data
    environment:
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_HOST=db
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/status.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  homeassistant:
    image: homeassistant/home-assistant:2026.11.2
    restart: unless-stopped
    # Loopback only — Caddy is the LAN face. Health/MCP/self-test use 127.0.0.1.
    ports:
      - "127.0.0.1:${HA_PORT:-8123}:8123"
    volumes:
      - ha_config:/config
    environment:
      - TZ=Etc/UTC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123"]
      interval: 30s
      timeout: 10s
      retries: 5

  caddy:
    # The only process that faces the LAN: HTTPS on 443, HTTP on 80 to redirect.
    # Always runs, including remote mode — LAN names stay live when the private
    # network is down, and the box CA is downloadable from homebrain.local either way.
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - VAULT_LAN_IP=${VAULT_LAN_IP:-127.0.0.2}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      # tls internal. wget --no-check-certificate accepts the leaf without
      # the host CA bundle. /healthz is served on the dashboard site, which
      # is also the default_sni / IP catch-all.
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_TAG:-1.37.5}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VAULT_PORT:-8082}:80"
    volumes:
      - ${VAULT_DATA_DIR:-/home/homebrain/vault-data}:/data
    environment:
      - DOMAIN=${VAULT_DOMAIN:-http://localhost:8082}
      - DATABASE_URL=mysql://${VAULT_DB_USER}:${VAULT_DB_PASSWORD}@db/${VAULT_DB_NAME}
      - ADMIN_TOKEN=${VAULT_ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=${VAULT_SIGNUPS_ALLOWED:-false}
      - SIGNUPS_VERIFY=false
      - INVITATIONS_ALLOWED=true
      - WEBSOCKET_ENABLED=true
      - PUSH_ENABLED=false
      - SENDS_ALLOWED=true
      - EMERGENCY_ACCESS_ALLOWED=true
      - LOG_LEVEL=warn
      - EXTENDED_LOGGING=true
      - SHOW_PASSWORD_HINT=false
      - ROCKET_WORKERS=2
      - ROCKET_PORT=80
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Vaultwarden runs its schema migrations against MariaDB on first start,
      # which on a Pi outlasts the first few probes. Without a grace period
      # Docker reports the container unhealthy while it is merely starting, and
      # that word lands in the first-boot log the owner is watching.
      start_period: 60s

  searxng:
    # Web search for the agent. OpenClaw's web_search tool queries it over
    # loopback; it fans each query out to public engines from this box's IP.
    # Not profile-gated: deploy and restore run `up --remove-orphans` without
    # optional profiles, which would stop it.
    # Idle cost is about 120 MiB.
    image: searxng/searxng:2026.9.29-4e2c1ea7f
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # The image refuses its default key. Generated per box before `up`.
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  camofox:
    # The agent's web browser (scripts/mcp-browser.py drives it). AI boxes
    # only: ensure_camofox builds the image from the pins in versions.json and
    # tags it :current, and get_compose_args turns this profile on once that
    # image exists. No `build:` here, so `up` never builds it and a failed
    # build cannot fail an update.
    profiles:
      - camofox
    image: homebrain-camofox:current
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:9377:9377"
    # Its own network: a page it renders cannot reach the database, Redis or
    # the other containers by name. No volumes: a fresh profile every start.
    networks:
      - camofox
    shm_size: "1gb"
    mem_limit: 2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - CAMOFOX_ACCESS_KEY=${CAMOFOX_ACCESS_KEY}
      # Crash reports would send the pages visited to the developer's server.
      - CAMOFOX_CRASH_REPORT_ENABLED=false
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9377/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  proton-bridge:
    # Profile-gated: only starts when the user has added a Proton account in
    # the dashboard (Connections → Email). Bridge exposes IMAP on :12143
    # and SMTP on :12025 on localhost; the email MCP server connects there.
    profiles:
      - proton-bridge
    # Built on the box from Proton's source at this tag (config/proton-bridge):
    # Bridge holds the mail credentials and sees every mail in plaintext, and
    # the third-party image it came from stopped at 3.19. The image name is
    # local only; update.sh pulls with --ignore-buildable, and `up`/`run`
    # build it when the tag moves.
    build:
      context: ./config/proton-bridge
      args:
        BRIDGE_VERSION: ${PROTON_BRIDGE_TAG:-3.27.2}
    image: homebrain-proton-bridge:${PROTON_BRIDGE_TAG:-3.27.2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:12143:143"
      - "127.0.0.1:12025:25"
    volumes:
      - proton_bridge_data:/root
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  camofox: {}

volumes:
  nextcloud_html:
  db_data:
  ha_config:
  redis_data:
  caddy_data:
  caddy_config:
  proton_bridge_data:

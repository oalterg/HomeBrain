name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck (error severity)
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error scripts/*.sh
      - name: ruff (syntax errors + real defects)
        run: |
          pip install -q ruff
          # E9 = syntax errors, F = undefined names / unused imports & vars.
          # Style classes (E7xx) are deliberately not gated.
          ruff check src/ scripts/ --select E9,F
      - name: compileall
        run: python3 -m compileall -q src/ scripts/
      - name: shell=True gate
        run: python3 .github/check_shell_true.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: pytest
        run: |
          # test_master_password.py drives the Flask app through its test client,
          # so it needs the app's web deps. redis is required even though the
          # limiter falls back to memory — limits raises at Limiter() without it.
          pip install -q pytest cryptography Flask flask-limiter flask-sock redis requests
          python3 -m pytest scripts/tests/test_healthcheck.py scripts/tests/test_recovery.py \
                            scripts/tests/test_master_password.py scripts/tests/test_mcp_crypto.py \
                            scripts/tests/test_setup_credentials.py \
                            scripts/tests/test_backup_discovery.py \
                            scripts/tests/test_mcp_servers_load.py scripts/tests/test_selftest.py -q
      - name: backup encryption round-trip (gpg)
        run: bash scripts/tests/test_backup_encryption.sh
      - name: update guard
        run: bash scripts/tests/test_update_guard.sh
      - name: platform detection (fixture sysfs trees)
        run: bash scripts/tests/test_platform_detect.sh
      - name: backup dir guard (internal-storage restore)
        run: bash scripts/tests/test_restore_internal.sh
      - name: portable instance-secret merge (base64 padding)
        run: bash scripts/tests/test_instance_secrets.sh
      - name: Nextcloud data move — pre-flight guards
        # Root for losetup/mount: the guards read real block-device geometry,
        # and the step they gate is `wipefs -a` on whatever it was handed.
        run: sudo bash scripts/tests/test_move_nc_data.sh
      - name: fresh-install wipe (volumes + bind mounts together)
        run: bash scripts/tests/test_fresh_install_wipe.sh
      - name: backup retention, off-site copy + resume semantics
        run: |
          # rclone drives the off-site half against a temp-dir alias remote.
          # Without it that half skips and the deletion-mirroring regression
          # goes unguarded.
          # `update` first: the runner image ships a pinned apt index that goes
          # stale against the mirror, and the install then 404s on a version
          # that has already been superseded.
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          bash scripts/tests/test_backup_retention.sh
      - name: self-MCP token derivation
        run: bash scripts/tests/test_self_token.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: |
          cp config/.env.template .env
          docker compose -f docker-compose.yml config > /dev/null
